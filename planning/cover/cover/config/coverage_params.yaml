rect_coverage_planner:
  ros__parameters:
    frame_id: map
    origin_x: 0.0
    origin_y: 0.0
    rect_width: 6.0
    rect_length: 20.0
    margin: 0.3
    desired_spacing: 2.0
    publish_rate_hz: 1.0
    pose_marker_scale: 0.18

    use_clicked_points: true
    inspection_pose_topic: /inspection/goal_pose
    bulldoze_clicked_point_topic: /bulldoze/clicked_point
    task_command_topic: /planning/task_command

    goal_topic: /planning/mission_planning/goal
    odom_topic: /localization/kinematic_state
    goal_reach_tolerance_m: 0.5
    goal_yaw_tolerance_rad: 0.3
    stop_speed_tolerance_mps: 0.05
    require_goal_yaw_alignment: false
    require_stop_at_goal: false
    goal_settle_time_s: 0.0
    republish_goal_interval_s: 1.0
    loop_goals: true
